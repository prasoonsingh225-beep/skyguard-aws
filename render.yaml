services:
  - type: web
    name: aero-guard-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python data_generator.py --out data.csv --n 8000 --spikes 8 --stuck 3 --drift 2 --comm 2 && python train.py --data data.csv --model model.h5 --window 60 --epochs 2 --batch 128
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: aero-guard-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: aero-guard-api
          envVarKey: RENDER_EXTERNAL_URL
    autoDeploy: true
