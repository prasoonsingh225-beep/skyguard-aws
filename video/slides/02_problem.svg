<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#fff8ef"/><text x="120" y="150" fill="#182335" font-family="Arial" font-weight="bold" font-size="64">The problem: bad observations</text><text x="125" y="260" fill="#46566b" font-family="Arial" font-size="32">AWS data powers high-stakes decisions.</text><rect x="130" y="360" width="500" height="300" rx="24" fill="#e74c3c"/><text x="190" y="475" fill="white" font-family="Arial" font-size="34">TEMPERATURE</text><text x="190" y="585" fill="white" font-family="Arial" font-weight="bold" font-size="92">55°C</text><text x="760" y="400" fill="#182335" font-family="Arial" font-size="34">Common failure modes</text><text x="760" y="480" fill="#d35400" font-family="Arial" font-size="30">• spikes and outliers</text><text x="760" y="540" fill="#d35400" font-family="Arial" font-size="30">• frozen sensor values</text><text x="760" y="600" fill="#d35400" font-family="Arial" font-size="30">• calibration drift</text><text x="760" y="660" fill="#d35400" font-family="Arial" font-size="30">• communication loss</text><text x="760" y="800" fill="#46566b" font-family="Arial" font-size="28">A single bad reading can affect forecasts,</text><text x="760" y="845" fill="#46566b" font-family="Arial" font-size="28">agriculture and disaster response.</text></svg>
