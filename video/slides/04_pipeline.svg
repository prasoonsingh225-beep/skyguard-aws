<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#07111f"/><text x="120" y="140" fill="white" font-family="Arial" font-weight="bold" font-size="64">End-to-end prototype pipeline</text><text x="150" y="350" fill="#58d6ff" font-family="Arial" font-size="32">1  Generate / ingest</text><text x="150" y="405" fill="#b8c7d9" font-family="Arial" font-size="26">Historical or streaming AWS data</text><text x="700" y="350" fill="#58d6ff" font-family="Arial" font-size="32">2  Learn normal</text><text x="700" y="405" fill="#b8c7d9" font-family="Arial" font-size="26">LSTM autoencoder</text><text x="1240" y="350" fill="#58d6ff" font-family="Arial" font-size="32">3  Score & explain</text><text x="1240" y="405" fill="#b8c7d9" font-family="Arial" font-size="26">MSE + diagnostic rules</text><path d="M520 370 L650 370 M1070 370 L1190 370" stroke="#58d6ff" stroke-width="10"/><text x="150" y="700" fill="#83e5b1" font-family="Arial" font-size="32">Outputs</text><text x="150" y="760" fill="white" font-family="Arial" font-size="30">Anomaly score    Severity    Confidence    Root cause    Sensor health</text><text x="150" y="900" fill="#91a8bd" font-family="Arial" font-size="26">Designed for scalable station networks and low-latency operations</text></svg>
