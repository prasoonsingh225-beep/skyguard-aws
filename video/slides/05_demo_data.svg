<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#101827"/><text x="120" y="140" fill="white" font-family="Arial" font-weight="bold" font-size="64">Demo 1: controlled anomaly testing</text><rect x="120" y="270" width="1680" height="570" rx="20" fill="#202d3d"/><text x="170" y="350" fill="#83e5b1" font-family="Courier New" font-size="30">$ python data_generator.py --out data.csv --n 30000</text><text x="170" y="440" fill="#d9e4ee" font-family="Courier New" font-size="28">Generated 30000 rows</text><text x="170" y="520" fill="#ffcc66" font-family="Courier New" font-size="28">Injected: spike | stuck | drift | communication_loss</text><text x="170" y="650" fill="#58d6ff" font-family="Courier New" font-size="28">temperature, pressure, humidity, label, anomaly_type</text><text x="170" y="755" fill="#d9e4ee" font-family="Courier New" font-size="28">Repeatable data makes accuracy and false-alarm testing measurable.</text></svg>
