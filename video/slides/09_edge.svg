<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#07111f"/><text x="120" y="140" fill="white" font-family="Arial" font-weight="bold" font-size="64">Edge-ready for remote stations</text><rect x="150" y="330" width="400" height="250" rx="28" fill="#26384b"/><text x="245" y="455" fill="#58d6ff" font-family="Arial" font-size="44">AWS</text><path d="M600 455 L820 455" stroke="#58d6ff" stroke-width="12"/><rect x="870" y="330" width="440" height="250" rx="28" fill="#145a78"/><text x="960" y="435" fill="white" font-family="Arial" font-size="38">TFLite</text><text x="935" y="500" fill="#b8c7d9" font-family="Arial" font-size="24">quantized model</text><path d="M1360 455 L1560 455" stroke="#58d6ff" stroke-width="12"/><rect x="1610" y="330" width="180" height="250" rx="28" fill="#16a085"/><text x="1645" y="455" fill="white" font-family="Arial" font-size="38">ESP32</text><text x="150" y="770" fill="#b8c7d9" font-family="Arial" font-size="32">Local rules catch obvious faults; suspicious windows can be sent to the server.</text><text x="150" y="850" fill="#83e5b1" font-family="Arial" font-size="30">Low power  •  Low bandwidth  •  Fast response</text></svg>
