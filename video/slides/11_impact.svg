<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="100%" height="100%" fill="#eaf6ff"/><text x="120" y="140" fill="#12304a" font-family="Arial" font-weight="bold" font-size="64">Impact for MoES and IMD</text><text x="150" y="350" fill="#1d6fa5" font-family="Arial" font-size="34">Trustworthy observations</text><text x="150" y="420" fill="#536b7c" font-family="Arial" font-size="28">Fewer corrupted values reach forecasts.</text><text x="150" y="560" fill="#1d6fa5" font-family="Arial" font-size="34">Faster maintenance</text><text x="150" y="630" fill="#536b7c" font-family="Arial" font-size="28">Root-cause hints prioritize field inspection.</text><text x="980" y="350" fill="#1d6fa5" font-family="Arial" font-size="34">Scalable network intelligence</text><text x="980" y="420" fill="#536b7c" font-family="Arial" font-size="28">Station-level health with central visibility.</text><text x="980" y="560" fill="#1d6fa5" font-family="Arial" font-size="34">Disaster resilience</text><text x="980" y="630" fill="#536b7c" font-family="Arial" font-size="28">Reliable inputs for time-critical decisions.</text><text x="150" y="870" fill="#12304a" font-family="Arial" font-size="30">From anomaly detection to a self-aware weather observation network.</text></svg>
